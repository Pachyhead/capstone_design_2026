[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone_endpoint"
version = "0.1.0"

dependencies = [
    "torch",
    "torchaudio",
    "ipykernel",
    "sounddevice>=0.5.5",
    "scipy>=1.17.1",
    "requests>=2.33.1",
    "numpy>=2.4.5",
    "funasr>=1.3.1",
    "mlx-whisper>=0.4.3",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
]

[tool.setuptools]
package-dir = {"" = "sender_src"}
py-modules = [
    "config",
    "logger",
    "receiver",
    "recoder",
    "sender",
    "speaker",
    "user",
]

[tool.setuptools.packages.find]
where = ["sender_src"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "fsq_ae",
    "grpc_getting_started",
    "logger",
    "preprocess_pipeline",
    "receiver",
    "recoder",
    "sender",
    "speaker",
    "tone_core",
    "user",
]
