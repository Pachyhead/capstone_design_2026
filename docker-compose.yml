services:
  qwen_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: qwen_api
    volumes:
     - ./qwen_tts_api:/app/qwen_tts_api
     - ./qwen_tts:/app/qwen_tts
     - ./DataBase:/app/DataBase
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  db:
    image: mysql:latest
    container_name: DB
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./DataBase/data:/var/lib/mysql
      - ./DataBase/init.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./DataBase/my.cnf:/etc/mysql/conf.d/my.cnf
  
  communication_container:
    build:
      context: .
      dockerfile: docker/Dockerfile.communication
    container_name: communication
    volumes:
     - ./grpc_getting_started:/app/grpc_getting_started
     - ./endpoint:/app/endpoint
     - ./receiver:/app/receiver
     - ./sender:/app/sender
     - ./src:/app/src
     - ./DataBase:/app/DataBase
     - /home/cap/data/models:/home/cap/data/models 
    environment:
      PYTHONPATH: /app/src
    env_file:
      - ./.env  
    ports:
      - "8001:8001"
    depends_on:
      - db
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]